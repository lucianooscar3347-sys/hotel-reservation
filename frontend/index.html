<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14284b" />
    <meta name="description" content="Grand Hôtel, Antananarivo : consultez les chambres, vérifiez les disponibilités et réservez en ligne." />
    <!-- Sécurité de session : la page n'est jamais conservée en cache (en complément des en-têtes HTTP, voir vite.config.js et public/_headers). -->
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
      // Page protégée restaurée par le bouton « Retour » depuis le cache avant/arrière du navigateur : on recharge,
      // l'application revérifie alors la session et redirige vers la connexion si elle n'est plus valide.
      window.addEventListener('pageshow', function (e) {
        if (e.persisted && /^\/(espace|admin)(\/|$)/.test(window.location.pathname)) window.location.reload();
      });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
    <title>Grand Hôtel – Réservation</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
